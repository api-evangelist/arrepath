name: ArrePath
description: 'ArrePath is an AI-driven pharmaceutical company based in Princeton, New Jersey, applying
  machine learning to accelerate small-molecule drug discovery in infectious disease. Its platform treats
  heterogeneous, small, and noisy bioactivity datasets as a modeling opportunity, enabling work on novel
  chemical classes where conventional approaches struggle; a public-data oral bioavailability model lifted
  a lead series from roughly 22% to 89% bioavailability. Lead programs include an oral LpxH inhibitor for
  outpatient urinary tract infections (pre-IND targeted mid-2026) and antibacterial programs against
  non-tuberculous mycobacterial (NTM) lung disease and tuberculosis, plus an early non-infectious discovery
  effort. ArrePath is a portfolio company of Insight Partners. It publishes no public developer API,
  documentation, or SDKs; this profile captures company identity and domain-security posture.'
